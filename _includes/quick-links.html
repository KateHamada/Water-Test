<style>
  /* Floating quick links box on the right, mirroring the fiscal year box on the left. */
  #quick-links {
    position: fixed; top: 90px; left: calc(50% + 370px + 16px); z-index: 10;
    background: #ffffff; color: #1f2937;
    border: 1px solid #e3e6ea; border-radius: 6px; padding: 8px 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  }
  #quick-links ul { list-style: none; margin: 4px 0 0; padding: 0; }
  #quick-links li { margin: 2px 0; }
  #quick-links-toggle { display: none; }
  #quick-links-list { list-style: none; margin: 4px 0 0; padding: 0; }
  #quick-links-list li { margin: 2px 0; }
  #quick-links-toggle:focus-visible { outline: 2px solid #2a6fb0; outline-offset: 2px; }
  .waffle-icon {
    display: grid; grid-template-columns: repeat(3, 4px); gap: 3px;
  }
  .waffle-icon span { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
  @media (max-width: 1100px) {
    #quick-links { top: 72px; left: auto; right: 12px; padding: 6px; }
    #quick-links-title { display: none; }
    #quick-links-toggle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; padding: 0; border: 0; border-radius: 4px;
      background: transparent; color: inherit; cursor: pointer;
    }
    #quick-links-list { display: none; margin-top: 6px; }
    #quick-links.is-open #quick-links-list { display: block; }
  }
</style>
<nav id="quick-links" aria-label="Quick links">
  <strong id="quick-links-title">Quick links</strong>
  <button id="quick-links-toggle" type="button" aria-label="Open quick links" aria-expanded="false" aria-controls="quick-links-list">
    <span class="waffle-icon" aria-hidden="true">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </span>
  </button>
  <ul id="quick-links-list">
    <li><a href="{{ '/' | relative_url }}">Summary</a></li>
    <li><a href="{{ '/Graphs/comparison.html' | relative_url }}">Usage FY Comparison</a></li>
    <li><a href="{{ '/Graphs/acc_comp.html' | relative_url }}">Usage Account Comparison</a></li>
    <li><a href="{{ '/Graphs/charge_comp.html' | relative_url }}">Charges FY Comparison</a></li>
    <li><a href="{{ '/Graphs/charge_acc_comp.html' | relative_url }}">Charges Account Comparison</a></li>
  </ul>
</nav>
<script>
  (() => {
    const nav = document.getElementById("quick-links");
    const toggle = document.getElementById("quick-links-toggle");

    function setOpen(open) {
      nav.classList.toggle("is-open", open);
      toggle.setAttribute("aria-expanded", String(open));
      toggle.setAttribute("aria-label", open ? "Close quick links" : "Open quick links");
    }

    toggle.addEventListener("click", () => {
      setOpen(toggle.getAttribute("aria-expanded") !== "true");
    });
    nav.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        setOpen(false);
        toggle.focus();
      }
    });
  })();
</script>
